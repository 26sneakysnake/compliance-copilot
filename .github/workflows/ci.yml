name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt opentelemetry-sdk
      - name: Unit tests (no network, no API key)
        run: python -m pytest -q

  data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build bronze/silver and enforce data contracts
        run: python -m ccp.cli pipeline

  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evaluation and non-regression gate against main
        run: |
          git fetch origin main --depth=1 || true
          python -m ccp.cli eval --gate --baseline-ref origin/main
      - name: Results must be committed when they change
        if: github.event_name == 'pull_request'
        run: git diff --stat --exit-code -- results/*.json || (echo "::warning::evaluation results changed, commit results/*.json" && exit 0)
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Risk register references and evidence exist, rendered doc is up to date
        run: |
          python -m ccp.cli risk-register
          git diff --exit-code docs/risk_register.md docs/data_catalog.md

  docker:
    runs-on: ubuntu-latest
    needs: [tests, eval-gate]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t compliance-copilot:ci .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 -e CCP_DEMO_KEYS=1 --name app compliance-copilot:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS -X POST localhost:8000/ask -H "X-API-Key: demo-analyst" -H "Content-Type: application/json" \
            -d '{"question":"How fast must a personal data breach be notified under the GDPR?"}' | tee answer.json
          grep -q '"status":"answered"' answer.json
