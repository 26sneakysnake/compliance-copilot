# Golden set for the compliance copilot. Written by hand, against the sample corpus.
# - expected: passage ids that support the answer (any one counts as a hit)
# - must_mention: facts the answer must contain (case-insensitive substring), for answer correctness
# - answerable: false means the copilot must refuse (out of scope, not in the corpus, or adversarial)
# - split: thresholds are tuned on "dev" only; "test" is reported separately
version: 3
items:
  # --------------------------------------------------------------- GDPR
  - {id: g01, split: dev,  answerable: true, question: "How quickly must a bank notify the regulator after a personal data breach?", expected: [GDPR-33], must_mention: ["72 hours"]}
  - {id: g02, split: test, answerable: true, question: "When do we have to tell the customers themselves about a data breach?", expected: [GDPR-34], must_mention: ["high risk"]}
  - {id: g03, split: dev,  answerable: true, question: "What are the legal bases that make processing of personal data lawful?", expected: [GDPR-6], must_mention: ["consent", "legitimate interests"]}
  - {id: g04, split: test, answerable: true, question: "Can a customer object to a credit decision taken only by an algorithm?", expected: [GDPR-22], must_mention: ["solely on automated processing"]}
  - {id: g05, split: dev,  answerable: true, question: "When is a data protection impact assessment (DPIA) mandatory?", expected: [GDPR-35], must_mention: ["high risk"]}
  - {id: g06, split: test, answerable: true, question: "What does the principle of data minimisation require?", expected: [GDPR-5], must_mention: ["necessary"]}
  - {id: g07, split: dev,  answerable: true, question: "What information must be given to a customer about automated decision-making when data is collected?", expected: [GDPR-13, GDPR-15], must_mention: ["logic involved"]}
  - {id: g08, split: test, answerable: true, question: "Is health data a special category of personal data?", expected: [GDPR-9], must_mention: ["health"]}
  - {id: g09, split: dev,  answerable: true, question: "What must a contract with a data processor contain?", expected: [GDPR-28], must_mention: ["documented instructions"]}
  - {id: g10, split: test, answerable: true, question: "What are the maximum GDPR fines for breaching the basic principles?", expected: [GDPR-83], must_mention: ["20 million", "4%"]}
  - {id: g11, split: dev,  answerable: true, question: "Is pseudonymised data still personal data?", expected: [GDPR-4], must_mention: ["remains personal data"]}
  - {id: g12, split: test, answerable: true, question: "When can a customer ask us to erase their data, and when can we refuse?", expected: [GDPR-17], must_mention: ["legal claims"]}
  - {id: g13, split: dev,  answerable: true, question: "What security measures does the GDPR expect, such as encryption?", expected: [GDPR-32], must_mention: ["encryption"]}
  - {id: g14, split: test, answerable: true, question: "What must be listed in the records of processing activities?", expected: [GDPR-30], must_mention: ["purposes"]}
  - {id: g15, split: dev,  answerable: true, question: "What does data protection by default mean?", expected: [GDPR-25], must_mention: ["by default"]}

