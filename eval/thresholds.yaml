# Non-regression gate, applied in CI to every push and pull request.
# Floors are absolute minimums; "no_regression" metrics may not drop below the
# committed baseline (results/<name>.json) by more than the tolerance.
# Safety metrics come first: refusing out-of-scope questions, never inventing a
# citation, and never skipping human review on a claim that needs it.
rag_extractive:
  min:
    all.refusal_recall: 0.85
    all.retrieval_hit_rate: 0.95
    all.cites_expected_rate: 0.90
    all.answer_rate: 0.90
    all.end_to_end_accuracy: 0.70
  max:
    all.invalid_citation_count: 0
  regression_tolerance: 0.02
  no_regression:
    - all.refusal_recall
    - all.retrieval_hit_rate
    - all.mrr
    - all.answer_rate
    - all.fact_recall
    - all.end_to_end_accuracy

# LLM runs are manual (they cost money); the same floors apply, plus fact recall.
rag_llm:
  min:
    all.refusal_recall: 0.85
    all.retrieval_hit_rate: 0.95
    all.cites_expected_rate: 0.90
    all.fact_recall: 0.80
    all.answer_rate: 0.55   # baseline 0.60 on 2026-10-14: too many false refusals, must not get worse
  max:
    all.invalid_citation_count: 0
  regression_tolerance: 0.03
  no_regression: [all.refusal_recall, all.answer_rate, all.fact_recall, all.end_to_end_accuracy]

triage_rules:
  min:
    human_review_recall: 1.0
    route_agreement: 0.80
    category_accuracy: 0.78
  max:
    missed_human_review: 0
  regression_tolerance: 0.0
  no_regression: [route_agreement, category_accuracy, urgency_accuracy]
