[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-copilot"
version = "0.1.0"
description = "RAG compliance copilot (EU AI Act, DORA, GDPR) with governance built in. Synthetic and fictional data only."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "pandas>=2.1",
  "pandera>=0.20",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = ["pytest>=8"]

[project.scripts]
ccp = "ccp.cli:main"

[tool.setuptools.packages.find]
include = ["ccp*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
